version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: transformers
        versions:
          - ">= 5.0.0"
      - dependency-name: torch
        versions:
          - ">= 2.10.0"
    groups:
      runtime-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
